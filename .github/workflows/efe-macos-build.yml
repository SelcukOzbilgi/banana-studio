name: Fork macOS build (arm64, development)
on:
  workflow_dispatch:
  # Dispatch only works once this file is on main; PRs get a build too.
  pull_request:
    branches: [main]
  push:
    tags: ['efe-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:desktop
      - run: swift build --package-path desktop/macos -c release
      - run: swift test --package-path desktop/macos
      - run: node scripts/fetch-node-runtime.mjs
      # --development: no Sparkle updater is started and automatic checks are off.
      - run: node scripts/package-macos.mjs --development
        env:
          BANANA_NODE_RUNTIME: ${{ github.workspace }}/.build/node-runtime/bin/node
          BANANA_BUILD_NUMBER: ${{ github.run_number }}
      - run: node scripts/test-local-generation.mjs
      - run: node scripts/audit-distribution.mjs ".build/staging/Banana Studio.app"
      - name: Zip the app without resource forks
        id: zip
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          archive=".build/Banana-Studio-${version}-${GITHUB_SHA::7}-macos-arm64.zip"
          ditto -c -k --norsrc --keepParent ".build/staging/Banana Studio.app" "$archive"
          if unzip -l "$archive" | grep -q __MACOSX; then echo 'Archive contains __MACOSX'; exit 1; fi
          shasum -a 256 "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banana-studio-macos-arm64
          path: ${{ steps.zip.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/efe-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banana-studio-macos-arm64
          path: dist-release
      - name: Attach the app to a GitHub Release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --prerelease \
            --notes "Personal development build (arm64). Ad-hoc signed, not notarized; Sparkle updates disabled."
